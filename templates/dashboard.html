<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · {{ site_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">{{ site_name }}</p>
      <h1>Reports</h1>
    </div>
    <a class="ghost" href="{{ url_for('logout') }}">Log out</a>
  </header>

  <main class="shell wide">
    <section class="card">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('generate') }}">
        <input type="hidden" name="count" value="{{ default_count }}">
        <div class="grid two">
          <label>
            Start date
            <input type="date" name="start_date" value="{{ start_date }}" required>
          </label>
          <label>
            End date
            <input type="date" name="end_date" value="{{ today }}" required>
          </label>
        </div>
        <button type="submit" {% if not source_ok %}disabled{% endif %}>Download PDF</button>
      </form>
    </section>
  </main>
</body>
</html>
